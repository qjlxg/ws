name: Process News Pipeline

on:
  schedule:
    - cron: '30 */6 * * *'  # 每6小时运行一次（可按需调整）
  workflow_dispatch:      # 支持手动触发

jobs:
  process:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Process News Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python process_news.py

      - name: Commit and Push Generated Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update news digest and reports [skip ci]" && git push)
