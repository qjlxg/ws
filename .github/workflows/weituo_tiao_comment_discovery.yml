name: weituo_tiao_comment_discovery

on:
  # 定时：北京时间每天 08:00、14:00、20:00（UTC 00:00、06:00、12:00）
  schedule:
    - cron: '0 0,6,12 * * *'
  # 脚本或工作流变更时自动运行
  push:
    paths:
      - 'weituo_tiao_comment_discovery.py'
      - '.github/workflows/weituo_tiao_comment_discovery.yml'
      - 'requirements.txt'
  workflow_dispatch:  # 手动触发

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run discovery script
        env:
          # 可选：在仓库 Settings → Secrets 中添加 TOUTIAO_COOKIE
          TOUTIAO_COOKIE: ${{ secrets.TOUTIAO_COOKIE }}
        run: python weituo_tiao_comment_discovery.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: comments-${{ github.run_id }}
          path: data/
          retention-days: 14

      - name: Commit results (optional)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          git diff --staged --quiet || git commit -m "chore: update comments $(date -u +%Y-%m-%d)"
          git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
