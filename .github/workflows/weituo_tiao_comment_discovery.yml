name: douyin_comment_discovery

on:
  # 定时：北京时间每天 09:00、15:00、21:00（UTC 01:00、07:00、13:00）
  schedule:
    - cron: '0 1,7,13 * * *'
  # 当脚本或工作流改动时自动运行
  push:
    paths:
      - 'douyin_comment_discovery.py'
      - '.github/workflows/douyin_comment_discovery.yml'
      - 'requirements.txt'
  workflow_dispatch:  # 手动触发按钮

jobs:
  douyin_discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # 赋予写入权限，自动 Git Commit 结果
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas requests playwright
          playwright install chromium --with-deps

      - name: Run Douyin Comment Discovery Script
        run: python douyin_comment_discovery.py

      - name: Commit and push results to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          git diff --staged --quiet || git commit -m "chore: update douyin comment material pool $(date -u +%Y-%m-%d)"
          git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
