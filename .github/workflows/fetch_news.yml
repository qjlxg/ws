name: fetch_news

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'fetch_news.py'
      - 'load_channels.py'
      - 'channels.csv'
      - '.github/workflows/fetch_news.yml'
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

# 关键：显式声明写入权限，解决 403 权限拒绝问题
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 恢复 SQLite 数据库缓存
        id: cache-db
        uses: actions/cache@v4
        with:
          path: data/news.db
          key: ${{ runner.os }}-news-db-${{ hashFiles('channels.csv') }}
          restore-keys: |
            ${{ runner.os }}-news-db-

      - name: 执行增量新闻采集脚本
        env:
          TZ: 'Asia/Shanghai'
        run: |
          python fetch_news.py

      - name: 自动提交并保存更新后的数据库与状态
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add data/news.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update news database [skip ci]" && git push)
