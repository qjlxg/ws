name: fetch_news

on:
  # 1. 每次推送修改了脚本、工作流或频道名单时自动触发
  push:
    branches:
      - main
      - master
    paths:
      - 'fetch_news.py'
      - 'load_channels.py'
      - 'channels.csv'
      - '.github/workflows/fetch_news.yml'
  
  # 2. 定时触发：北京时间每天早上 8 点和晚上 8 点自动运行
  # GitHub Cron 使用 UTC 时间。北京时间 = UTC + 8
  # 北京时间 08:00 = UTC 00:00 -> 0 0 * * *
  # 北京时间 20:00 = UTC 12:00 -> 0 12 * * *
  schedule:
    - cron: '0 0,12 * * *'

  # 3. 允许在 GitHub Actions 页面手动点击触发
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 恢复 SQLite 数据库缓存
        id: cache-db
        uses: actions/cache@v4
        with:
          path: data/news.db
          key: ${{ runner.os }}-news-db-${{ hashFiles('channels.csv') }}
          restore-keys: |
            ${{ runner.os }}-news-db-

      - name: 执行增量新闻采集脚本
        env:
          TZ: 'Asia/Shanghai'
        run: |
          python fetch_news.py

      - name: 自动提交并保存更新后的数据库与状态
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 检查 data/news.db 是否有变动
          git status
          git add data/news.db
          
          # 如果有新数据入库，则自动提交回仓库，实现跨运行持久化
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update news database [skip ci]" && git push)